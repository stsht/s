<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="/t/manifest.webmanifest">
  <title>Counter</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
    #app{width:100%;height:100%;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .counter{width:min(92vw,30rem);height:min(72svh,34rem);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
    .value{font-variant-numeric:tabular-nums lining-nums;font-weight:700;line-height:.92;font-size:clamp(5rem,23vw,10rem);letter-spacing:-.045em;text-align:center}
    .hint{margin-top:1rem;color:#666;font-size:.75rem;transition:opacity .3s}
    .controls{position:absolute;bottom:0;left:0;display:flex;gap:.2rem;align-items:center}
    .control{width:2.7rem;height:2.7rem;border:0;background:transparent;color:#666;display:grid;place-items:center;font-size:1.4rem;border-radius:999px;padding:0}
    .control:active{background:#111;color:#fff;transform:scale(.94)}
    .control svg{width:1.3rem;height:1.3rem}
    .control.on{color:#aaa}
    .control.off{color:#444}
    @media (min-width:700px){.counter{width:min(42vw,30rem);height:min(64svh,34rem)}.value{font-size:clamp(6rem,12vw,10rem)}}
  </style>
</head>
<body>
<div id="app"><main class="counter" aria-label="Counter">
  <div id="value" class="value">0</div>
  <div id="hint" class="hint">tap anywhere</div>
  <div class="controls">
    <button id="minus" class="control" aria-label="Decrease" title="Decrease">−</button>
    <button id="reset" class="control" aria-label="Reset" title="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11a8.1 8.1 0 0 0-14.9-4.2L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 14.9 4.2L21 15"/><path d="M21 20v-5h-5"/></svg></button>
    <button id="vibe" class="control off" aria-label="Vibration off" title="Vibration" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 4v16M15 4v16"/><path d="M5 7v10M19 7v10"/><path d="M2.5 9.5v5M21.5 9.5v5"/></svg></button>
    <button id="sound" class="control off" aria-label="Sound off" title="Sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9.5c1.3 1.3 1.3 3.7 0 5"/><path d="M19.5 7c2.6 2.5 2.6 6.5 0 9"/></svg></button>
  </div>
</main></div>
<script>
(()=>{
  const K='t-counter-v1',VK='t-vibration-v1',SK='t-sound-v1';
  const app=document.getElementById('app'),v=document.getElementById('value'),m=document.getElementById('minus'),r=document.getElementById('reset'),vb=document.getElementById('vibe'),sb=document.getElementById('sound'),h=document.getElementById('hint');
  let n=Math.max(0,parseInt(localStorage.getItem(K)||'0',10)||0),vibration=localStorage.getItem(VK)==='1',sound=localStorage.getItem(SK)==='1',timer,repeat,holding=false,audio;
  const render=()=>v.textContent=n.toLocaleString('en-US'),save=()=>localStorage.setItem(K,String(n));
  const updateButtons=()=>{vb.classList.toggle('on',vibration);vb.classList.toggle('off',!vibration);vb.setAttribute('aria-pressed',String(vibration));vb.setAttribute('aria-label',`Vibration ${vibration?'on':'off'}`);sb.classList.toggle('on',sound);sb.classList.toggle('off',!sound);sb.setAttribute('aria-pressed',String(sound));sb.setAttribute('aria-label',`Sound ${sound?'on':'off'}`)};
  function beep(){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.045,audio.currentTime+.004);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.055);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.06)}catch(e){}}
  function feedback(d){if(vibration&&navigator.vibrate)navigator.vibrate(d>0?7:9);beep()}
  function step(d){n=Math.max(0,n+d);render();save();feedback(d)}
  function start(){holding=true;let delay=280;const tick=()=>{if(!holding)return;step(1);delay=Math.max(22,delay*.84);repeat=setTimeout(tick,delay)};tick()}
  function cancel(){holding=false;clearTimeout(timer);clearTimeout(repeat)}
  app.addEventListener('pointerdown',e=>{if(e.target.closest('.control'))return;clearTimeout(timer);timer=setTimeout(start,520)});
  app.addEventListener('pointerup',e=>{if(e.target.closest('.control'))return;const was=holding;cancel();if(!was)step(1)});
  app.addEventListener('pointercancel',cancel);
  app.addEventListener('pointerleave',()=>{if(holding)cancel()});
  m.onclick=e=>{e.stopPropagation();step(-1)};
  r.onclick=e=>{e.stopPropagation();if(!n)return;n=0;render();save();feedback(0)};
  vb.onclick=e=>{e.stopPropagation();vibration=!vibration;localStorage.setItem(VK,vibration?'1':'0');updateButtons();if(vibration&&navigator.vibrate)navigator.vibrate(12)};
  sb.onclick=e=>{e.stopPropagation();sound=!sound;localStorage.setItem(SK,sound?'1':'0');updateButtons();if(sound)beep()};
  setTimeout(()=>h.style.opacity=0,2200);render();updateButtons();
  if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/t/sw.js',{scope:'/t/'}).catch(()=>{}))}
})()
</script>
</body>
</html>
