<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>StarShots — Private Client Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #ffffff;
      --field: #f8faff;
      --ink: #1f1a17;
      --muted: #5f6673;
      --line: #dfe7f2;
      --line-strong: #c8d5e8;
      --accent: #5f95f5;
      --danger: #b91c1c;
      --shadow: 0 30px 90px rgba(15, 23, 42, 0.09);
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #111216;
        --panel: #1e2024;
        --field: #16181c;
        --ink: #f6f8ff;
        --muted: #9aa3b2;
        --line: #2c2f35;
        --line-strong: #3a3e46;
        --accent: #8ab4ff;
        --danger: #fca5a5;
        --shadow: 0 30px 90px rgba(0, 0, 0, 0.44);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh; font-family: var(--font); color: var(--ink); background: var(--bg);
      -webkit-font-smoothing: antialiased; position: relative; isolation: isolate;
      padding: 20px; display: grid; place-items: center;
    }
    .ss-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--bg); }
    .ss-bg::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse 72rem 34rem at 50% 112%, rgba(17,17,17,.045), transparent 72%),
        radial-gradient(ellipse 52rem 28rem at 0% 0%, rgba(17,17,17,.022), transparent 70%),
        radial-gradient(ellipse 52rem 28rem at 100% 100%, rgba(17,17,17,.028), transparent 70%);
    }
    @media (prefers-color-scheme: dark) {
      .ss-bg::before {
        background: radial-gradient(ellipse 72rem 34rem at 50% 112%, rgba(255,255,255,.055), transparent 72%),
          radial-gradient(ellipse 52rem 28rem at 0% 0%, rgba(255,255,255,.022), transparent 70%),
          radial-gradient(ellipse 52rem 28rem at 100% 100%, rgba(255,255,255,.032), transparent 70%);
      }
    }
    .portal-card {
      position: relative; z-index: 1; width: min(100%, 460px); padding: 40px 34px 30px;
      border-radius: 28px; border: 1px solid var(--line-strong); background: var(--panel);
      box-shadow: var(--shadow); text-align: center;
    }
    .portal-logo { display: inline-block; margin-bottom: 26px; }
    .portal-logo img { width: min(172px, 52vw); height: auto; display: block; }
    .portal-eyebrow { margin: 0 0 8px; font-size: .66rem; font-weight: 650; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0 0 10px; font-size: clamp(1.42rem,3.8vw,1.72rem); font-weight: 600; line-height: 1.2; letter-spacing: -.028em; color: var(--ink); }
    .portal-desc { margin: 0 auto 26px; max-width: 34ch; font-size: .86rem; font-weight: 450; line-height: 1.58; color: var(--muted); }
    .portal-form { display: flex; gap: 8px; width: 100%; }
    .portal-input {
      flex: 1 1 auto; min-width: 0; height: 42px; padding: 0 14px;
      border: 1px solid color-mix(in srgb,var(--line) 90%,transparent); border-radius: 10px;
      background: var(--field); color: var(--ink); font: 500 .86rem/1 var(--font);
      letter-spacing: .01em; outline: none; transition: border-color 140ms ease,box-shadow 140ms ease;
    }
    .portal-input::placeholder { color: color-mix(in srgb,var(--muted) 72%,transparent); }
    .portal-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent); }
    .portal-btn {
      flex: 0 0 auto; height: 42px; padding: 0 18px; border: 1px solid var(--ink);
      border-radius: 10px; background: var(--ink); color: var(--panel);
      font: 600 .82rem/1 var(--font); letter-spacing: -.01em; cursor: pointer;
      transition: opacity 140ms ease,background 140ms ease;
    }
    .portal-btn:hover { opacity: .88; }
    @media (prefers-color-scheme: dark) {
      .portal-btn { background: #2c3038; border-color: rgba(255,255,255,.12); color: #f4f6fa; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
      .portal-btn:hover { opacity: 1; background: #353a44; }
    }
    .portal-error { margin: 10px 0 0; min-height: 18px; font-size: .76rem; font-weight: 500; color: var(--danger); text-align: left; }
    .portal-footer {
      margin-top: 22px; padding-top: 18px; border-top: 1px solid color-mix(in srgb,var(--line) 75%,transparent);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .78rem; color: var(--muted);
    }
    .portal-ig { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); font-weight: 600; text-decoration: none; transition: opacity 140ms ease; }
    .portal-ig:hover { opacity: .72; }
    .portal-ig svg { width: 16px; height: 16px; flex-shrink: 0; }
    @media (max-width: 480px) {
      .portal-card { padding: 32px 22px 24px; border-radius: 24px; }
      .portal-form { flex-direction: column; }
      .portal-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="ss-bg" aria-hidden="true"></div>
  <main class="portal-card">
    <a class="portal-logo" href="/" aria-label="StarShots">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/logo-hero-white.png">
        <img src="/logo-hero.png" alt="StarShots">
      </picture>
    </a>
    <p class="portal-eyebrow">Private Client Portal</p>
    <h1>Your Private Delivery Space</h1>
    <p class="portal-desc">Enter your gallery code to view your photos and invoice.</p>
    <form class="portal-form" id="portal-form" novalidate>
      <input id="portal-code" class="portal-input" type="text" inputmode="text" autocomplete="off"
        autocapitalize="none" spellcheck="false" placeholder="Enter gallery code" aria-label="Gallery code">
      <button class="portal-btn" type="submit">Open</button>
    </form>
    <p class="portal-error" id="portal-error" role="alert" aria-live="polite"></p>
    <footer class="portal-footer">
      <a class="portal-ig" href="https://instagram.com/starshots.id" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
        </svg><span>@starshots.id</span>
      </a>
      <span>StarShots ID</span>
    </footer>
  </main>
  <script>
    (function () {
      var form = document.getElementById('portal-form');
      var input = document.getElementById('portal-code');
      var error = document.getElementById('portal-error');
      if (!form || !input) return;
      function extractCode(raw) {
        var val = String(raw || '').trim();
        if (!val) return '';
        var match = val.match(/(?:^|\/)([a-z0-9]{12}|[a-z0-9]{7})(?:[/?#]|$)/i);
        if (match) return match[1].toLowerCase();
        var clean = val.toLowerCase().replace(/[^a-z0-9]/g, '');
        return (clean.length === 7 || clean.length === 12) ? clean : '';
      }
      input.addEventListener('input', function () { if (error && error.textContent) error.textContent = ''; });
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var code = extractCode(input.value);
        if (!code) {
          if (error) error.textContent = 'Please enter a valid 7- or 12-character gallery code.';
          input.focus(); return;
        }
        window.location.assign('/' + encodeURIComponent(code));
      });
    })();
  </script>
</body>
</html>
