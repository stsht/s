name: Session gallery acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/session-gallery-acceptance-pr239]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:session-gallery
      - run: npm run test:invoice-ledger
      - run: npm run build
