<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>Counter</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{width:100%;height:100%;min-height:100%;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.counter{width:min(92vw,30rem);height:min(72svh,34rem);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.value{font-variant-numeric:tabular-nums lining-nums;font-weight:700;line-height:.92;font-size:clamp(5rem,23vw,10rem);letter-spacing:-.045em;min-width:2ch;text-align:center}
.hint{margin-top:1rem;color:#666;font-size:.75rem;letter-spacing:.03em;transition:opacity .3s}
.controls{position:absolute;bottom:0;right:0;display:flex;gap:.35rem}
.control{width:2.75rem;height:2.75rem;border:0;background:transparent;color:#777;display:grid;place-items:center;font-size:1.45rem;border-radius:999px;padding:0}
.control:active{background:#111;color:#fff;transform:scale(.94)}
.control svg{width:1.35rem;height:1.35rem}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .08s}
.flash.on{opacity:.025}
@media (min-width:700px){
  .counter{width:min(42vw,30rem);height:min(64svh,34rem)}
  .value{font-size:clamp(6rem,12vw,10rem)}
}
</style>
</head>
<body>
<div id="app">
  <main class="counter" aria-label="Counter">
    <div id="value" class="value">0</div>
    <div id="hint" class="hint">tap anywhere</div>
    <div class="controls">
      <button id="minus" class="control" aria-label="Decrease">−</button>
      <button id="reset" class="control" aria-label="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M20 11a8.1 8.1 0 0 0-14.9-4.2L3 9"/>
          <path d="M3 4v5h5"/>
          <path d="M4 13a8.1 8.1 0 0 0 14.9 4.2L21 15"/>
          <path d="M21 20v-5h-5"/>
        </svg>
      </button>
    </div>
  </main>
</div>
<div id="flash" class="flash"></div>
<script>
(()=> {
  const KEY="counter-total-v1";
  const valueEl=document.getElementById("value");
  const hintEl=document.getElementById("hint");
  const flash=document.getElementById("flash");
  const minus=document.getElementById("minus");
  const reset=document.getElementById("reset");
  let total=Math.max(0,parseInt(localStorage.getItem(KEY)||"0",10)||0);
  let holdTimer=null,repeatTimer=null,holding=false;

  function render(){ valueEl.textContent=total.toLocaleString("en-US"); }
  function save(){ localStorage.setItem(KEY,String(total)); }
  function step(delta){
    total=Math.max(0,total+delta);
    render(); save();
    flash.classList.add("on"); setTimeout(()=>flash.classList.remove("on"),70);
    if(navigator.vibrate) navigator.vibrate(delta>0?7:9);
  }
  function startHold(){
    holding=true; let delay=280;
    const tick=()=>{ if(!holding)return; step(1); delay=Math.max(22,delay*.84); repeatTimer=setTimeout(tick,delay); };
    tick();
  }
  function cancelHold(){
    holding=false; clearTimeout(holdTimer); clearTimeout(repeatTimer);
  }

  // Entire app surface: tap = +1. Controls are excluded.
  document.getElementById("app").addEventListener("pointerdown",e=>{
    if(e.target.closest(".control")) return;
    clearTimeout(holdTimer);
    holdTimer=setTimeout(startHold,520);
  });
  document.getElementById("app").addEventListener("pointerup",e=>{
    if(e.target.closest(".control")) return;
    const wasHolding=holding;
    cancelHold();
    if(!wasHolding) step(1);
  });
  document.getElementById("app").addEventListener("pointercancel",cancelHold);
  document.getElementById("app").addEventListener("pointerleave",()=>{ if(holding) cancelHold(); });

  minus.addEventListener("click",e=>{e.stopPropagation();step(-1)});
  reset.addEventListener("click",e=>{
    e.stopPropagation();
    if(total===0)return;
    total=0; render(); save();
    if(navigator.vibrate) navigator.vibrate([8,35,8]);
  });

  // Keyboard support for desktop testing.
  addEventListener("keydown",e=>{
    if(e.key===" "||e.key==="Enter"){e.preventDefault();step(1)}
    else if(e.key==="ArrowDown"||e.key==="-"){e.preventDefault();step(-1)}
    else if(e.key==="r"||e.key==="R"){e.preventDefault();total=0;render();save()}
  });

  hintEl.addEventListener("transitionend",()=>{});
  setTimeout(()=>{hintEl.style.opacity="0"},2500);
  render();

  if("serviceWorker" in navigator){
    addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
